<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AlgoArena — Master Episode Engine</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0d1424;
    --card: #111a2e;
    --border: #1e293b;
    --cyan: #00f5d4;
    --green: #10b981;
    --red: #ff3b5c;
    --amber: #fbbf24;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  body {
    background: #03050a;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }
  /* 9:16 Vertical Shorts Frame */
  .stage {
    width: 100%;
    max-width: 420px;
    min-height: 760px;
    background: radial-gradient(circle at 50% 0%, #101b36 0%, var(--bg) 65%);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 20px 18px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 0 60px rgba(0, 245, 212, 0.08);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .ep-badge {
    background: rgba(0, 245, 212, 0.12);
    color: var(--cyan);
    border: 1px solid rgba(0, 245, 212, 0.35);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.4px;
    padding: 5px 10px;
    border-radius: 999px;
  }
  .timer-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
    transition: all 0.2s;
  }
  .timer-box.urgent {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 15px rgba(255, 59, 92, 0.35);
    transform: scale(1.06);
  }
  h1 {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .rules-bar {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--cyan);
    text-align: center;
    margin-bottom: 14px;
  }
  .status-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 800;
  }
  .step-tag { color: var(--cyan); }
  .phase-tag { color: var(--amber); }

  /* Contender / Option Cards */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    transition: all 0.25s ease;
  }
  .card.active {
    border-color: var(--cyan);
    box-shadow: 0 0 20px rgba(0, 245, 212, 0.18);
  }
  .card.win {
    border-color: var(--green);
    background: rgba(16, 185, 129, 0.08);
    box-shadow: 0 0 24px rgba(16, 185, 129, 0.28);
  }
  .card.lose {
    border-color: var(--red);
    background: rgba(255, 59, 92, 0.08);
    box-shadow: 0 0 20px rgba(255, 59, 92, 0.22);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .card-title { font-size: 15px; font-weight: 900; }
  .card-sub { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 600; }
  .badge-pill {
    font-size: 10.5px;
    font-weight: 900;
    padding: 4px 9px;
    border-radius: 8px;
    background: #1e293b;
    color: var(--muted);
    letter-spacing: 0.7px;
  }
  .badge-pill.win { background: rgba(16, 185, 129, 0.22); color: var(--green); }
  .badge-pill.lose { background: rgba(255, 59, 92, 0.22); color: var(--red); }
  .badge-pill.active { background: rgba(0, 245, 212, 0.18); color: var(--cyan); }

  .bar-track {
    width: 100%;
    height: 9px;
    background: #1e293b;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), #3b82f6);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .card.win .bar-fill { background: linear-gradient(90deg, var(--cyan), var(--green)); }
  .card.lose .bar-fill { background: var(--red); }

  .metric-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 800;
  }
  .metric-label { color: var(--muted); font-weight: 600; }

  /* Commentary & Reveal Box */
  .commentary {
    background: #060911;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    font-size: 12.5px;
    line-height: 1.42;
    color: var(--text);
    min-height: 64px;
    margin-bottom: 12px;
  }
  .commentary strong { color: var(--cyan); }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  button {
    border: none;
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 13.5px;
    font-weight: 900;
    letter-spacing: 0.6px;
    cursor: pointer;
    background: var(--cyan);
    color: #050811;
    transition: opacity 0.2s;
  }
  button.secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>

<div class="stage">
  <div>
    <div class="top-row">
      <div class="ep-badge" id="uiBadge">ALGOARENA • EP 02</div>
      <div class="timer-box" id="uiTimer">00:10.0</div>
    </div>
    <h1 id="uiTitle">Episode Title</h1>
    <div class="subtitle" id="uiSubtitle">Subtitle goes here</div>
    <div class="rules-bar" id="uiRules">Rules summary</div>

    <div class="status-strip">
      <span class="step-tag" id="uiStep">STEP 0 / 5</span>
      <span class="phase-tag" id="uiPhase">STANDBY</span>
    </div>

    <div class="cards" id="uiCards"></div>
  </div>

  <div>
    <div class="commentary" id="uiLog">Press <strong>RUN SIMULATION</strong> to start recording sequence...</div>
    <div class="controls">
      <button id="runBtn" onclick="playEpisode()">RUN SIMULATION</button>
      <button class="secondary" onclick="initEpisode()">RESET</button>
    </div>
  </div>
</div>

<script>
/**
 * ============================================================================
 * EDIT ONLY THIS OBJECT TO CREATE EPISODES 2 THROUGH 10 IN 5 MINUTES
 * Currently pre-loaded with Episode 2: The Rigged Coin Flip (Kelly Criterion)
 * ============================================================================
 */
const EPISODE_CONFIG = {
  badge: "ALGOARENA • EP 02",
  title: "Can You Beat a 60% Rigged Coin Flip?",
  subtitle: "Starting Bankroll: $1,000 • 20 Flips • Pick Your Bet Size",
  rules: "60% HEADS (2x PAYOUT) • 40% TAILS (LOSE BET)",
  countdownSeconds: 7, // Timer ticks right before the final reveal
  countdownAtStep: 3,  // Step index where timer triggers viewer challenge
  maxBarValue: 8000,   // Scale for 100% progress bar width
  valuePrefix: "$",
  valueSuffix: "",

  // Define 2 to 4 contenders / strategies
  contenders: [
    { id: "yolo",   name: "All-In Gambler", sub: "Bets 100% every flip", initial: 1000, label: "Bankroll" },
    { id: "half",   name: "Aggressive Human", sub: "Bets 50% every flip", initial: 1000, label: "Bankroll" },
    { id: "kelly",  name: "AI Quant (Kelly)", sub: "Bets optimal 20%",    initial: 1000, label: "Bankroll" }
  ],

  // Define the exact sequence of frames (each step pauses `delayMs` for pacing)
  steps: [
    {
      stepLabel: "FLIP 1 / 20",
      phase: "HEADS (+WIN)",
      delayMs: 1300,
      log: "Flip 1 lands <strong>HEADS</strong>! The All-In Gambler doubles immediately to $2,000.",
      updates: {
        yolo:  { value: 2000, badge: "2X HIT", state: "active" },
        half:  { value: 1500, badge: "+$500", state: "" },
        kelly: { value: 1200, badge: "+$200", state: "" }
      }
    },
    {
      stepLabel: "FLIP 4 / 20",
      phase: "3 HEADS IN A ROW",
      delayMs: 1400,
      log: "Hot streak! All-In surges to <strong>$8,000</strong> while the AI Quant sits calmly at $1,728.",
      updates: {
        yolo:  { value: 8000, badge: "LEADING", state: "active" },
        half:  { value: 3375, badge: "RISING", state: "" },
        kelly: { value: 1728, badge: "STEADY", state: "" }
      }
    },
    {
      stepLabel: "FLIP 5 / 20",
      phase: "FIRST TAILS (-LOSS)",
      delayMs: 1600,
      log: "💥 <strong>TAILS!</strong> Even on a 60% rigged coin, one loss wipes the All-In player to <strong>$0</strong>!",
      updates: {
        yolo:  { value: 0,    badge: "BANKRUPT", state: "lose" },
        half:  { value: 1687, badge: "-50% HIT", state: "" },
        kelly: { value: 1382, badge: "SAFE", state: "" }
      }
    },
    {
      stepLabel: "FLIP 15 / 20",
      phase: "YOUR TURN — PICK!",
      delayMs: 1200,
      triggerCountdown: true, // Pauses and ticks down `countdownSeconds` so viewers guess!
      log: "⏳ <strong>7 SECONDS:</strong> Who finishes Flip 20 richer—50% Human or 20% AI Quant? Comment now!",
      updates: {
        yolo:  { value: 0,    badge: "ELIMINATED", state: "lose" },
        half:  { value: 2130, badge: "VOLATILE", state: "active" },
        kelly: { value: 3910, badge: "COMPOUNDING", state: "active" }
      }
    },
    {
      stepLabel: "FINAL • FLIP 20",
      phase: "KELLY CRITERION WINS",
      delayMs: 2500,
      log: "🏆 <strong>AI QUANT WINS ($6,191)!</strong> Over-betting a positive edge destroys growth—Kelly f* = 2p - 1 = 20%.",
      updates: {
        yolo:  { value: 0,    badge: "BUSTED ($0)", state: "lose" },
        half:  { value: 1420, badge: "VOLATILITY DRAG", state: "lose" },
        kelly: { value: 6191, badge: "OPTIMAL WINNER", state: "win" }
      }
    }
  ]
};

/**
 * ============================================================================
 * ENGINE LOGIC (NO NEED TO EDIT BELOW THIS LINE)
 * ============================================================================
 */
let isRunning = false;

function formatVal(num) {
  return `${EPISODE_CONFIG.valuePrefix}${num.toLocaleString("en-US")}${EPISODE_CONFIG.valueSuffix}`;
}

function initEpisode() {
  isRunning = false;
  document.getElementById("runBtn").disabled = false;
  document.getElementById("uiBadge").textContent = EPISODE_CONFIG.badge;
  document.getElementById("uiTitle").textContent = EPISODE_CONFIG.title;
  document.getElementById("uiSubtitle").textContent = EPISODE_CONFIG.subtitle;
  document.getElementById("uiRules").textContent = EPISODE_CONFIG.rules;
  document.getElementById("uiStep").textContent = `STEP 0 / ${EPISODE_CONFIG.steps.length}`;
  document.getElementById("uiPhase").textContent = "READY";
  document.getElementById("uiLog").innerHTML = "Press <strong>RUN SIMULATION</strong> to start recording sequence...";

  const timerEl = document.getElementById("uiTimer");
  timerEl.className = "timer-box";
  timerEl.textContent = `00:${String(EPISODE_CONFIG.countdownSeconds).padStart(2, "0")}.0`;

  const container = document.getElementById("uiCards");
  container.innerHTML = "";

  EPISODE_CONFIG.contenders.forEach(c => {
    const pct = Math.min(100, Math.max(0, (c.initial / EPISODE_CONFIG.maxBarValue) * 100));
    container.innerHTML += `
      <div class="card" id="card-${c.id}">
        <div class="card-top">
          <div><span class="card-title">${c.name}</span><span class="card-sub">${c.sub}</span></div>
          <div class="badge-pill" id="badge-${c.id}">WAITING</div>
        </div>
        <div class="bar-track"><div class="bar-fill" id="bar-${c.id}" style="width:${pct}%"></div></div>
        <div class="metric-row">
          <span class="metric-label">${c.label}</span>
          <span id="val-${c.id}">${formatVal(c.initial)}</span>
        </div>
      </div>
    `;
  });
}

function runCountdown(seconds) {
  return new Promise(resolve => {
    const timerEl = document.getElementById("uiTimer");
    let remaining = seconds * 10; // tenths of a second
    const interval = setInterval(() => {
      if (!isRunning) { clearInterval(interval); resolve(); return; }
      remaining--;
      const sec = Math.floor(remaining / 10);
      const tenth = remaining % 10;
      timerEl.textContent = `00:${String(sec).padStart(2, "0")}.${tenth}`;
      if (sec <= 3) timerEl.classList.add("urgent");
      if (remaining <= 0) {
        clearInterval(interval);
        timerEl.classList.remove("urgent");
        resolve();
      }
    }, 100);
  });
}

async function playEpisode() {
  if (isRunning) return;
  initEpisode();
  isRunning = true;
  document.getElementById("runBtn").disabled = true;

  for (let i = 0; i < EPISODE_CONFIG.steps.length; i++) {
    if (!isRunning) return;
    const step = EPISODE_CONFIG.steps[i];

    document.getElementById("uiStep").textContent = step.stepLabel;
    document.getElementById("uiPhase").textContent = step.phase;
    document.getElementById("uiLog").innerHTML = step.log;

    Object.entries(step.updates).forEach(([id, data]) => {
      const card = document.getElementById(`card-${id}`);
      const badge = document.getElementById(`badge-${id}`);
      const bar = document.getElementById(`bar-${id}`);
      const val = document.getElementById(`val-${id}`);

      card.className = `card ${data.state || ""}`;
      badge.className = `badge-pill ${data.state || ""}`;
      badge.textContent = data.badge;
      val.textContent = formatVal(data.value);

      const pct = Math.min(100, Math.max(0, (data.value / EPISODE_CONFIG.maxBarValue) * 100));
      bar.style.width = pct + "%";
    });

    if (step.triggerCountdown) {
      await runCountdown(EPISODE_CONFIG.countdownSeconds);
    } else {
      await new Promise(r => setTimeout(r, step.delayMs));
    }
  }

  isRunning = false;
  const btn = document.getElementById("runBtn");
  btn.disabled = false;
  btn.textContent = "REPLAY EPISODE";
}

initEpisode();
</script>
</body>
</html>
